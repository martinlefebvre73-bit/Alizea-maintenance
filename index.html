<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAPPORT DE FIN DE QUART – MAINTENANCE</title>
    <!-- SheetJS for local Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --accent-color: #3182ce;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
            --focus-ring: #63b3ed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            border: 1px solid var(--border-color);
        }

        header {
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sub-header {
            font-size: 0.9rem;
            color: #718096;
            margin-top: 4px;
        }

        .header-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            background-color: #edf2f7;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--primary-color);
        }

        input[type="date"], select, input[type="text"], textarea {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.95rem;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
        }

        .section {
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            background-color: #fff;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .dictation-wrapper {
            position: relative;
            margin-top: 8px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            padding-right: 40px;
            font-family: inherit;
        }

        .mic-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #e2e8f0;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: #4a5568;
        }

        .mic-btn:hover {
            background: #cbd5e0;
            color: #2d3748;
        }

        .mic-btn.recording {
            background: #e53e3e;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .footer-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 2px solid var(--border-color);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .btn-clear {
            background-color: #e53e3e;
            color: white;
        }

        .btn-clear:hover {
            background-color: #c53030;
        }

        .btn-save {
            background-color: #38a169;
            color: white;
        }

        .btn-save:hover {
            background-color: #2f855a;
        }

        #status-message {
            margin-top: 12px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        .status-success {
            background-color: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .status-error {
            background-color: #fed7d7;
            color: #742a2a;
            border: 1px solid #feb2b2;
        }

        .status-info {
            background-color: #ebf8ff;
            color: #2c5282;
            border: 1px solid #bee3f8;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Rapport de fin de quart – Maintenance</h1>
        <div class="sub-header">Résidence ALIZÉA</div>
    </header>

    <form id="maintenanceForm">
        <!-- En-tête : Date & Horaire -->
        <div class="header-inputs">
            <div class="input-group">
                <label for="dateSelect">Date :</label>
                <input type="date" id="dateSelect" required>
            </div>
            <div class="input-group">
                <label for="horaireSelect">Horaire / Quart :</label>
                <div style="display: flex; gap: 8px;">
                    <select id="horaireSelect" style="flex: 1;">
                        <option value="Jour (07:00 - 15:00)">Jour (07:00 - 15:00)</option>
                        <option value="Soir (15:00 - 23:00)">Soir (15:00 - 23:00)</option>
                        <option value="Nuit (23:00 - 07:00)">Nuit (23:00 - 07:00)</option>
                        <option value="Autre">Autre</option>
                    </select>
                    <div class="dictation-wrapper" style="margin-top: 0; width: 40px;">
                        <button type="button" class="mic-btn" onclick="startDictation('horaireAutre')" title="Activer la dictée pour l'horaire">🎤</button>
                    </div>
                </div>
                <input type="text" id="horaireAutre" placeholder="Préciser si autre ou remarques horaire..." style="margin-top: 6px;">
            </div>
        </div>

        <!-- Sujets traités -->
        <div class="section">
            <div class="section-title">Sujets traités</div>
            <div class="checkbox-grid">
                <label class="checkbox-item"><input type="checkbox" id="subj_appels"> Appels de service complétés</label>
                <label class="checkbox-item"><input type="checkbox" id="subj_inspection"> Inspection générale</label>
                <label class="checkbox-item"><input type="checkbox" id="subj_urgence"> Intervention d’urgence</label>
                <label class="checkbox-item"><input type="checkbox" id="subj_suivi"> Suivi travaux en cours</label>
                <label class="checkbox-item"><input type="checkbox" id="subj_mecanique"> Vérification équipements mécaniques</label>
                <label class="checkbox-item"><input type="checkbox" id="subj_electrique"> Vérification systèmes électriques</label>
                <label class="checkbox-item"><input type="checkbox" id="subj_nettoyage"> Nettoyage / entretien installations</label>
            </div>
            <div class="input-group" style="margin-top: 8px;">
                <label for="subj_autre">Autre sujet :</label>
                <div class="dictation-wrapper">
                    <input type="text" id="subj_autre" placeholder="Spécifier autre sujet...">
                    <button type="button" class="mic-btn" style="top: 4px;" onclick="startDictation('subj_autre')" title="Activer la dictée">🎤</button>
                </div>
            </div>
        </div>

        <!-- Appels de service / Interventions -->
        <div class="section">
            <div class="section-title">Appels de service / Interventions (inclure # logement + détail)</div>
            <div class="dictation-wrapper">
                <textarea id="appels_details" placeholder="Saisir ou dicter les détails des interventions..."></textarea>
                <button type="button" class="mic-btn" onclick="startDictation('appels_details')" title="Activer la dictée">🎤</button>
            </div>
        </div>

        <!-- Particularités / Piscine -->
        <div class="section">
            <div class="section-title">Particularités / Piscine</div>
            <div class="checkbox-grid">
                <label class="checkbox-item"><input type="checkbox" id="piscine_conforme"> Conforme</label>
                <label class="checkbox-item"><input type="checkbox" id="piscine_non_conforme"> Non conforme</label>
                <label class="checkbox-item"><input type="checkbox" id="piscine_nettoyage"> Nettoyage effectué</label>
                <label class="checkbox-item"><input type="checkbox" id="piscine_produit"> Produit chimique ajusté</label>
            </div>
            <div class="input-group">
                <label for="piscine_details">Détails piscine :</label>
                <div class="dictation-wrapper">
                    <textarea id="piscine_details" placeholder="Ajustements, paramètres pH, chlore, observations..."></textarea>
                    <button type="button" class="mic-btn" onclick="startDictation('piscine_details')" title="Activer la dictée">🎤</button>
                </div>
            </div>
        </div>

        <!-- Intervention d'urgence -->
        <div class="section">
            <div class="section-title">Intervention d’urgence</div>
            <div class="dictation-wrapper">
                <textarea id="urgence_details" placeholder="Détails des urgences traitées durant le quart..."></textarea>
                <button type="button" class="mic-btn" onclick="startDictation('urgence_details')" title="Activer la dictée">🎤</button>
            </div>
        </div>

        <!-- Suivi travaux en cours -->
        <div class="section">
            <div class="section-title">Suivi travaux en cours</div>
            <div class="dictation-wrapper">
                <textarea id="travaux_details" placeholder="État d'avancement des sous-traitants ou chantiers..."></textarea>
                <button type="button" class="mic-btn" onclick="startDictation('travaux_details')" title="Activer la dictée">🎤</button>
            </div>
        </div>

        <!-- Autres observations -->
        <div class="section">
            <div class="section-title">Autres observations</div>
            <div class="dictation-wrapper">
                <textarea id="autres_obs" placeholder="Remarques générales, relève de quart..."></textarea>
                <button type="button" class="mic-btn" onclick="startDictation('autres_obs')" title="Activer la dictée">🎤</button>
            </div>
        </div>

        <!-- Détails et Variants -->
        <div class="section">
            <div class="section-title">Détails et Variants</div>
            <div class="dictation-wrapper">
                <textarea id="details_variants" placeholder="Informations complémentaires, pièces à commander..."></textarea>
                <button type="button" class="mic-btn" onclick="startDictation('details_variants')" title="Activer la dictée">🎤</button>
            </div>
        </div>

        <!-- Signature -->
        <div class="footer-inputs">
            <div class="input-group">
                <label for="nom_technicien">Nom :</label>
                <div class="dictation-wrapper">
                    <input type="text" id="nom_technicien" placeholder="Nom de l'employé">
                    <button type="button" class="mic-btn" style="top: 4px;" onclick="startDictation('nom_technicien')" title="Activer la dictée">🎤</button>
                </div>
            </div>
            <div class="input-group">
                <label for="signature_tech">Signature :</label>
                <input type="text" id="signature_tech" placeholder="Initiales ou signature numérique">
            </div>
        </div>

        <!-- Boutons d'action -->
        <div class="action-buttons">
            <button type="button" class="btn btn-clear" onclick="effacerFormulaire()">🗑️ Effacer le formulaire</button>
            <button type="button" class="btn btn-save" onclick="sauvegarderRapport()">💾 Enregistrer (Excel Local & GitHub)</button>
        </div>
    </form>

    <div id="status-message"></div>
</div>

<script>
    // Initialisation de la date du jour par défaut
    document.getElementById('dateSelect').valueAsDate = new Date();

    // Configuration Reconnaissance Vocale (Dictée)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let activeRecognition = null;
    let activeTargetId = null;

    function startDictation(targetId) {
        if (!SpeechRecognition) {
            alert("Désolé, la reconnaissance vocale n'est pas supportée sur ce navigateur. Veuillez utiliser Google Chrome ou Safari.");
            return;
        }

        const targetElem = document.getElementById(targetId);
        const micButtons = document.querySelectorAll('.mic-btn');

        // Si la reconnaissance est déjà en cours sur le même champ, on l'arrête
        if (activeRecognition && activeTargetId === targetId) {
            activeRecognition.stop();
            return;
        }

        // Si une autre reconnaissance tournait, on l'arrête
        if (activeRecognition) {
            activeRecognition.stop();
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'fr-FR';
        recognition.interimResults = false;
        recognition.continuous = false;

        activeRecognition = recognition;
        activeTargetId = targetId;

        // Trouver le bouton cliqué pour feedback visuel
        const currentBtn = targetElem.parentElement.querySelector('.mic-btn') || event.currentTarget;

        recognition.onstart = function() {
            currentBtn.classList.add('recording');
            showStatus("Dictée vocale activée... Parlez maintenant.", "info");
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            if (targetElem.tagName === 'TEXTAREA' || targetElem.type === 'text') {
                if (targetElem.value) {
                    targetElem.value += ' ' + transcript;
                } else {
                    targetElem.value = transcript;
                }
            }
        };

        recognition.onerror = function(event) {
            showStatus("Erreur de reconnaissance vocale : " + event.error, "error");
            currentBtn.classList.remove('recording');
        };

        recognition.onend = function() {
            currentBtn.classList.remove('recording');
            activeRecognition = null;
            activeTargetId = null;
            hideStatus();
        };

        recognition.start();
    }

    // Effacer le formulaire
    function effacerFormulaire() {
        if (confirm("Êtes-vous sûr de vouloir effacer l'ensemble des données saisies ?")) {
            document.getElementById('maintenanceForm').reset();
            document.getElementById('dateSelect').valueAsDate = new Date();
            showStatus("Formulaire effacé avec succès.", "info");
            setTimeout(hideStatus, 3000);
        }
    }

    // Affichage des messages de statut
    function showStatus(msg, type) {
        const statusDiv = document.getElementById('status-message');
        statusDiv.textContent = msg;
        statusDiv.className = 'status-' + type;
        statusDiv.style.display = 'block';
    }

    function hideStatus() {
        const statusDiv = document.getElementById('status-message');
        statusDiv.style.display = 'none';
    }

    // Génération du classeur Excel structuré avec mise en page
    function generateExcelWorkbook() {
        const dateVal = document.getElementById('dateSelect').value;
        const horaireVal = document.getElementById('horaireSelect').value + 
            (document.getElementById('horaireAutre').value ? ' (' + document.getElementById('horaireAutre').value + ')' : '');
        
        // Sujets cochés
        let sujets = [];
        if (document.getElementById('subj_appels').checked) sujets.push("Appels de service complétés");
        if (document.getElementById('subj_inspection').checked) sujets.push("Inspection générale");
        if (document.getElementById('subj_urgence').checked) sujets.push("Intervention d’urgence");
        if (document.getElementById('subj_suivi').checked) sujets.push("Suivi travaux en cours");
        if (document.getElementById('subj_mecanique').checked) sujets.push("Vérification équipements mécaniques");
        if (document.getElementById('subj_electrique').checked) sujets.push("Vérification systèmes électriques");
        if (document.getElementById('subj_nettoyage').checked) sujets.push("Nettoyage / entretien installations");
        if (document.getElementById('subj_autre').value) sujets.push("Autre: " + document.getElementById('subj_autre').value);

        // Piscine
        let piscineStatut = [];
        if (document.getElementById('piscine_conforme').checked) piscineStatut.push("Conforme");
        if (document.getElementById('piscine_non_conforme').checked) piscineStatut.push("Non conforme");
        if (document.getElementById('piscine_nettoyage').checked) piscineStatut.push("Nettoyage effectué");
        if (document.getElementById('piscine_produit').checked) piscineStatut.push("Produit chimique ajusté");

        const data = [
            ["RAPPORT DE FIN DE QUART – MAINTENANCE", ""],
            ["Résidence ALIZÉA", ""],
            ["", ""],
            ["Date", dateVal],
            ["Horaire / Quart", horaireVal],
            ["", ""],
            ["SUJETS TRAITÉS", sujets.join(" | ")],
            ["", ""],
            ["APPELS DE SERVICE / INTERVENTIONS", document.getElementById('appels_details').value],
            ["", ""],
            ["PARTICULARITÉS / PISCINE - Statut", piscineStatut.join(" | ")],
            ["PARTICULARITÉS / PISCINE - Détails", document.getElementById('piscine_details').value],
            ["", ""],
            ["INTERVENTION D'URGENCE", document.getElementById('urgence_details').value],
            ["", ""],
            ["SUIVI TRAVAUX EN COURS", document.getElementById('travaux_details').value],
            ["", ""],
            ["AUTRES OBSERVATIONS", document.getElementById('autres_obs').value],
            ["", ""],
            ["DÉTAILS ET VARIANTS", document.getElementById('details_variants').value],
            ["", ""],
            ["Nom de l'intervenant", document.getElementById('nom_technicien').value],
            ["Signature / Validation", document.getElementById('signature_tech').value]
        ];

        const ws = XLSX.utils.aoa_to_sheet(data);
        
        // Largeur de colonnes
        ws['!cols'] = [
            { wch: 35 },
            { wch: 70 }
        ];

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Rapport Maintenance");
        return wb;
    }

    // Sauvegarde Excel Locale + Publication GitHub Repository
    async function sauvegarderRapport() {
        const dateVal = document.getElementById('dateSelect').value || new Date().toISOString().split('T')[0];
        const filename = `Rapport_Maintenance_${dateVal}.xlsx`;

        showStatus("Génération du fichier Excel...", "info");

        try {
            const wb = generateExcelWorkbook();

            // 1. Sauvegarde locale Excel
            XLSX.writeFile(wb, filename);

            showStatus("Fichier Excel téléchargé localement. Envoi vers GitHub en cours...", "info");

            // 2. Préparation du fichier Base64 pour l'API GitHub
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });

            // Token et Config GitHub
            const token = "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";
            const owner = "martinlefebvre73-bit";
            const repo = "Alizea-maintenance";
            const path = `rapports/${filename}`;

            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

            // Vérifier si le fichier existe déjà pour obtenir le SHA (mise à jour)
            let sha = null;
            try {
                const getRes = await fetch(url, {
                    headers: { "Authorization": `token ${token}` }
                });
                if (getRes.ok) {
                    const getData = await getRes.json();
                    sha = getData.sha;
                }
            } catch (e) {
                console.log("Nouveau fichier sur GitHub");
            }

            // Corps du commit GitHub
            const bodyData = {
                message: `Ajout rapport de maintenance du ${dateVal}`,
                content: wbout
            };
            if (sha) bodyData.sha = sha;

            const putRes = await fetch(url, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(bodyData)
            });

            if (putRes.ok) {
                showStatus(` Succès ! Copie enregistrée localement et publiée sur GitHub (${owner}/${repo}).`, "success");
            } else {
                const errData = await putRes.json();
                showStatus(` Sauvegarde locale réussie, mais erreur GitHub: ${errData.message || putRes.statusText}`, "error");
            }

        } catch (err) {
            console.error(err);
            showStatus("Erreur lors de la sauvegarde : " + err.message, "error");
        }
    }
</script>

</body>
</html>
